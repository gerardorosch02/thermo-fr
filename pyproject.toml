[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermo-fr"
version = "0.1.0"
description = "How temperature drives French electricity demand and day-ahead prices"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Gerardo Rosales"}]
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "holidays>=0.40", "requests>=2.28"]

[project.optional-dependencies]
forecast = ["lightgbm>=4.0", "scikit-learn>=1.3"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7"]

[project.scripts]
thermo-fr = "thermo_fr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

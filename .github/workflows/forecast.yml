name: Day-ahead forecast

# Keeps published/ current without a local machine. Each job restores the
# public dataset into a fresh SQLite store, runs one step, exports the dataset
# again and commits only published/. The ENTSO-E token comes from the
# repository secret ENTSOE_API_KEY and is only ever read as an environment
# variable by the job; nothing prints or writes it.
#
# Three steps:
#   morning-run  weekday mornings: fetches the ten days around the next delivery
#                day and predicts with the stored model published/model/honest_v2.txt
#                (lagged nuclear generation, neighbour prices, residual load; see
#                docs/experiments.md); if one of its inputs is missing for the day
#                it predicts with published/model/honest.txt instead and records
#                the fallback in the data status
#   settle       daily afternoon: fetches the auction results, scores the forecasts
#   refit        first weekday of the month: fetches the full history since 2021,
#                refits both models (honest_v2, the default, and honest, the
#                fallback), commits only the model files and their metadata.
#                Dispatched from the laptop at 07:00 London (`thermo-fr dispatch
#                --step refit`), the 02:00 UTC cron is a backup; `--once-per-month`
#                makes the second trigger of a month exit as "already refitted
#                this month" without committing, and the metadata records which
#                trigger (dispatch or cron) produced the fit
#
# Two publishers. This workflow commits the public dataset under published/.
# The laptop commits one file, published/market.json (the aggregates of the
# forecast against EEX traded prices, which only it holds), through
# `thermo-fr market publish` after its settle; the publish step here reads
# that file and copies it into status.json unchanged, and never writes it.
# Both sides pull with rebase before pushing and never force, and since they
# touch different files a rebase cannot conflict.
#
# Timing. GitHub cron is UTC; Paris is UTC+2 in summer and UTC+1 in winter. The
# ENTSO-E load forecast is due at 10:00 Paris on the day before delivery and
# the EEX day-ahead future trades from about 11:15 Paris, so a forecast that can
# be scored against the market must be issued between 10:05 and 11:00 Paris.
# Every step is triggered by the laptop with `thermo-fr dispatch` (a
# workflow_dispatch through the GitHub CLI): the pre-market morning-run at
# 10:05 and 10:30 Paris on weekdays, the settle at 14:20 London, the refit at
# 07:00 London on the first weekday of the month. GitHub's schedule trigger is
# not reliable enough for a deadline: on 10 and 11 October 2026 the settle cron
# ran four to five hours late and the morning crons never ran, and on 12
# October six scheduled runs arrived 9 to 12 hours late. The weekday morning
# crons were removed on 2026-10-13 for that reason: arriving hours late they
# could not back up a pre-market forecast and only added after-window versions
# and failure risk. Two crons remain as backups, for steps where a late run is
# harmless: the settle at 13:15 UTC and the refit at 02:00 UTC on the 1st, 2nd
# and 3rd (the job proceeds on the first weekday only). `thermo-fr
# schedule-step` decides a dispatched morning-run by the Paris clock: before
# 10:05 it is skipped, inside 10:05 to 11:00 it is the pre-market run, from
# 11:00 it runs for information only; the dashboards label that version
# "issued after the market window, not tradeable" and it never replaces a
# pre-market version, because the headline of a day is the last version issued
# before the window. A version's issue time is the run's wall clock, never a
# scheduled time. A backup that arrives after the dispatched run changes
# nothing: the settle stores the same prices again and scores nothing new, the
# refit exits as already refitted this month, and the commit step below
# commits nothing when only the stamps in status.json changed. The concurrency
# group serialises runs, so two of them never publish at once.

on:
  schedule:
    - cron: "15 13 * * *"     # backup settle (the laptop dispatches the settle at 14:20 London)
    - cron: "0 2 1-3 * *"     # backup refit, on the first weekday of the month only (the laptop dispatches the refit at 07:00 London)
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        type: choice
        options: [morning-run, settle, refit]
        default: morning-run

permissions:
  contents: write

concurrency:
  group: forecast-publish    # one run at a time: a second trigger of any step waits for the first to finish, so two runs never publish at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[forecast]"

      - name: Decide which step to run
        id: step
        run: |
          thermo-fr schedule-step --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}" \
            --input "${{ github.event.inputs.step }}" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the public dataset into a fresh store
        if: steps.step.outputs.step != 'skip'
        run: thermo-fr import-published --from published --db data/forecast.db

      - name: Run ${{ steps.step.outputs.step }}
        if: steps.step.outputs.step != 'skip'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          case "${{ steps.step.outputs.step }}" in
            settle)
              thermo-fr settle --kind scheduled --db data/forecast.db ;;
            refit)
              thermo-fr refit-model --start 2021-01-01 --out published/model --feature-sets honest_v2 honest \
                --once-per-month --trigger "${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'cron' }}" ;;
            morning-run)
              test -f published/model/honest_v2.txt || { echo "no stored model: run the refit step first"; exit 1; }
              thermo-fr morning-run --kind scheduled --db data/forecast.db --data data/forecast/inputs.csv \
                --feature-sets honest_v2 --model-file published/model/honest_v2.txt --fallback-model-file published/model/honest.txt ;;
          esac

      - name: Export the public dataset
        if: steps.step.outputs.step != 'skip' && steps.step.outputs.step != 'refit'
        run: thermo-fr publish --out published --db data/forecast.db

      - name: Commit published/
        if: steps.step.outputs.step != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.step.outputs.step }}" = "refit" ]; then
            git add published/model
          else
            git add published
            git reset -q -- published/market.json  # the laptop's file: never committed from here
            if thermo-fr publish-unchanged --out published; then
              git reset -q  # only the stamps in status.json moved (a backup settle after the dispatched one): nothing to publish
            fi
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish ${{ steps.step.outputs.step }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi

name: Day-ahead forecast

# Keeps published/ current without a local machine. Each job restores the
# public dataset into a fresh SQLite store, runs one step, exports the dataset
# again and commits only published/. The ENTSO-E token comes from the
# repository secret ENTSOE_API_KEY and is only ever read as an environment
# variable by the job; nothing prints or writes it.
#
# Three steps:
#   morning-run  weekday mornings: fetches the ten days around the next delivery
#                day and predicts with the stored model published/model/honest.txt
#   settle       daily afternoon: fetches the auction results, scores the forecasts
#   refit        first weekday of the month: fetches the full history since 2021,
#                refits, commits only the model file and its metadata
#
# GitHub cron is UTC. London is UTC+1 from late March to late October and UTC
# in winter, so the morning runs are 10:30 and 11:30 London in summer and
# 09:30 and 10:30 in winter; settle is 14:15 London in summer, 13:15 in winter.
# The refit cron fires on the 1st, 2nd and 3rd at 02:00 UTC and the job
# continues only on the first weekday of the month.

on:
  schedule:
    - cron: "30 9 * * 1-5"    # morning-run
    - cron: "30 10 * * 1-5"   # morning-run
    - cron: "15 13 * * *"     # settle
    - cron: "0 2 1-3 * *"     # refit, on the first weekday of the month only
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        type: choice
        options: [morning-run, settle, refit]
        default: morning-run

permissions:
  contents: write

concurrency:
  group: forecast-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[forecast]"

      - name: Decide which step to run
        id: step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            step="${{ github.event.inputs.step }}"
          elif [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
            step="settle"
          elif [ "${{ github.event.schedule }}" = "0 2 1-3 * *" ]; then
            # first weekday of the month: day 1 if it is Mon to Fri, else the Monday that follows
            step=$(python -c "import datetime as d; t=d.date.today(); f=t.replace(day=1); f=f+d.timedelta(days=(7-f.weekday())%7) if f.weekday()>4 else f; print('refit' if t==f else 'skip')")
          else
            step="morning-run"
          fi
          echo "step=$step" >> "$GITHUB_OUTPUT"
          echo "step: $step"

      - name: Restore the public dataset into a fresh store
        if: steps.step.outputs.step != 'skip'
        run: thermo-fr import-published --from published --db data/forecast.db

      - name: Run ${{ steps.step.outputs.step }}
        if: steps.step.outputs.step != 'skip'
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          case "${{ steps.step.outputs.step }}" in
            settle)
              thermo-fr settle --kind scheduled --db data/forecast.db ;;
            refit)
              thermo-fr refit-model --start 2021-01-01 --out published/model ;;
            morning-run)
              test -f published/model/honest.txt || { echo "no stored model: run the refit step first"; exit 1; }
              thermo-fr morning-run --kind scheduled --db data/forecast.db --data data/forecast/inputs.csv \
                --feature-sets honest --model-file published/model/honest.txt ;;
          esac

      - name: Export the public dataset
        if: steps.step.outputs.step != 'skip' && steps.step.outputs.step != 'refit'
        run: thermo-fr publish --out published --db data/forecast.db

      - name: Commit published/
        if: steps.step.outputs.step != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.step.outputs.step }}" = "refit" ]; then
            git add published/model
          else
            git add published
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish ${{ steps.step.outputs.step }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
